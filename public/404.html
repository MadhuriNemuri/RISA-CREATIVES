    <!-- GitHub Pages Single Page App Redirect Handler -->
    <script type="text/javascript">
      // Handles client-side route redirection on GitHub Pages
      (function () {
        var path = window.location.pathname;
        if (path && path !== "/") {
          // If accessing a subroute like /about directly, redirect to hash or preserve path
          sessionStorage.setItem("redirectPath", path + window.location.search + window.location.hash);
        }
      })();
    </script>
